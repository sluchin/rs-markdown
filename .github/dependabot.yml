# Dependabot: 依存の更新を, 週に 1 回 PR にする (マイナー版とパッチ版は, 種類ごとに 1 つの PR にまとめる).
# PR では, いつもの CI が走る. マージは手で行う.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    # typescript-eslint が対応するまで, TypeScript 6.1 以降は上げない (peerDependencies が < 6.1.0).
    ignore:
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gradle"
    directories:
      - "/src-tauri/gen/android"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories:
      - "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
