name: Release

# リリース用のビルド.
#   desktop: PC (Linux, Windows, macOS) のインストーラ. tauri-action でビルドする
#   android: Android の APK (arm64). 開発用のイメージ (docker/Dockerfile) でビルドして, 署名する
# タグ (v から始まる. 例: v0.1.0) を push したときは, 成果物を GitHub Releases のドラフトに載せる.
# 手動実行 (Actions の「Release」の「Run workflow」) のときは, Artifacts にだけ保存する.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    permissions:
      contents: write # GitHub Releases への書き込みに必要
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # glibc の古い環境でも動くように, 古い Ubuntu でビルドする
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin は Rust のターゲットではないので, macOS は 2 つのアーキテクチャを入れる
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Install the frontend dependencies
        run: npm ci

      # deb, rpm, AppImage, msi, nsis, dmg を作る. タグのときは, GitHub Releases のドラフトに載せる
      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'rs-markdown ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload the bundles
        uses: actions/upload-artifact@v7
        with:
          name: rs-markdown-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Android のリリース版は署名が要る. 署名の鍵は, リポジトリの Secrets に登録する.
  #   ANDROID_KEYSTORE_BASE64: キーストア (.jks) を base64 にしたもの
  #   ANDROID_KEYSTORE_PASSWORD: キーストアのパスワード
  #   ANDROID_KEY_ALIAS: 鍵の別名
  #   ANDROID_KEY_PASSWORD: 鍵のパスワード
  # 登録していなければ, Android のビルドは行わない.
  android:
    name: android
    # Releases のドラフトは desktop が作るので, その後に載せる
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APK_DIR: src-tauri/gen/android/app/build/outputs/apk/universal/release

    steps:
      - name: Check the signing key
        id: key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set. Skip the Android build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Build the development image
        if: steps.key.outputs.enabled == 'true'
        uses: ./.github/actions/docker-image

      - name: Build the APK
        if: steps.key.outputs.enabled == 'true'
        # dev は TTY を使う設定なので, -T で無効にする (CI には端末がない)
        run: |
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm install
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm -T dev \
            npx tauri android build --apk --target aarch64

      # 鍵はランナーの一時ディレクトリに置き, コンテナからは読むだけにする
      - name: Sign the APK
        if: steps.key.outputs.enabled == 'true'
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export APK_NAME="rs-markdown_${GITHUB_REF_NAME}_android_arm64.apk"
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm -T \
            -v "$RUNNER_TEMP/release.jks:/tmp/release.jks:ro" \
            -e ANDROID_KEYSTORE_PASSWORD -e ANDROID_KEY_ALIAS -e ANDROID_KEY_PASSWORD \
            -e APK_DIR -e APK_NAME \
            dev sh -c '"$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks /tmp/release.jks \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$APK_DIR/$APK_NAME" \
              "$APK_DIR/app-universal-release-unsigned.apk"'
          rm -f "$RUNNER_TEMP/release.jks"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload the APK to the release
        if: steps.key.outputs.enabled == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$APK_DIR/$APK_NAME" --clobber

      - name: Upload the APK
        if: steps.key.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rs-markdown-android
          path: ${{ env.APK_DIR }}/${{ env.APK_NAME }}
          if-no-files-found: error
